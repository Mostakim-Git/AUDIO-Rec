name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a1079c-audio-rec

permissions:
  contents: read

jobs:
  assemble:
    name: Assemble installable debug APK
    runs-on: ubuntu-latest
    env:
      # Set AUDIOREC_API_URL in GitHub Actions variables to bake in a deployed API URL.
      VITE_API_URL: ${{ vars.AUDIOREC_API_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci

      - name: Build and sync web app
        run: npm run android:sync

      - name: Assemble APK
        run: ./gradlew --no-daemon assembleDebug
        working-directory: android

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AUDIO-rec-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
