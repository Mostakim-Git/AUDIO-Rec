name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the APK as a GitHub Release download
        required: false
        type: boolean
        default: false
  push:
    branches:
      - arena/01a1079c-audio-rec

permissions:
  contents: write

jobs:
  assemble:
    name: Assemble installable debug APK
    runs-on: ubuntu-24.04
    env:
      # Set AUDIOREC_API_URL in GitHub Actions variables to bake in a deployed API URL.
      VITE_API_URL: ${{ vars.AUDIOREC_API_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install npm dependencies
        run: npm ci

      - name: Build and sync web app
        run: npm run android:sync

      - name: Assemble APK
        run: ./gradlew --no-daemon assembleDebug
        working-directory: android

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: AUDIO-rec-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          tag="android-debug-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "$apk" \
            --target "$GITHUB_SHA" \
            --title "AUDIO-rec Android APK (build ${GITHUB_RUN_NUMBER})" \
            --notes "Installable AUDIO-rec debug APK built from ${GITHUB_SHA}. Configure the AUDIOREC_API_URL Actions variable before building if the app should connect to a deployed HTTPS API."
